function bind(){const c=document.querySelector('#card');if(!c)return;c.onclick=e=>{if(!moved&&!e.target.closest('a,button'))c.classList.toggle('flip')};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('flip')}}}
