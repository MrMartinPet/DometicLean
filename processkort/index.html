<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3449">
  <title>Processkort | Dometic Tidaholm</title>
  <meta name="description" content="Lär känna fabrikens processer med interaktiva kort.">
  <style>
    :root{--navy:#0b3449;--ink:#0a2738;--blue:#1b6d8f;--lime:#dcff59;--red:#d94850;--green:#15945a}
    *{box-sizing:border-box}html{background:#082231}body{margin:0;background:linear-gradient(rgba(15,74,99,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(15,74,99,.055) 1px,transparent 1px),#eef3f5;background-size:26px 26px;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{min-height:100svh;overflow:hidden;padding-bottom:3rem}
    header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;width:min(calc(100% - 2rem),720px);margin:auto;padding:1.2rem 0 1rem}.mark{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:.8rem;background:var(--navy);color:var(--lime);font-size:.82rem;font-weight:900}.eyebrow{margin:0 0 .1rem;color:#5b7480;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:1.18rem;letter-spacing:-.03em}.count{font-size:1.1rem;font-weight:900}.count span{color:#78909b;font-size:.75rem}
    .workspace{width:min(calc(100% - 2rem),520px);margin:auto}.progress{height:5px;margin:0 0 1rem;overflow:hidden;border-radius:99px;background:#d3e0e5}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#78bfcf);transition:width .32s}
    .deck{position:relative;height:min(55svh,470px);min-height:390px;perspective:1200px}.next,.card{position:absolute;inset:0;border-radius:1.65rem}.next{inset:.75rem .75rem -.75rem;background:#b8c9d0;box-shadow:0 16px 35px rgba(12,48,65,.12)}.card{width:100%;padding:0;border:0;background:transparent;cursor:grab;touch-action:pan-y;user-select:none;z-index:2;transform-origin:50% 110%}.card:focus-visible{outline:4px solid #87cbe0;outline-offset:4px}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .54s cubic-bezier(.2,.75,.2,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;border-radius:1.65rem;padding:1.5rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 55px rgba(7,40,56,.18),inset 0 0 0 1px rgba(255,255,255,.12)}
    .front{justify-content:space-between;background:radial-gradient(circle at 80% 20%,rgba(220,255,89,.22),transparent 30%),linear-gradient(145deg,#0d4059,#071f2d 78%);color:white}.front:after{content:"";position:absolute;right:-3rem;bottom:-4rem;width:15rem;height:15rem;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 2rem rgba(255,255,255,.035),0 0 0 4rem rgba(255,255,255,.025)}.back{transform:rotateY(180deg);background:white;border:1px solid #d3e0e5}.topline{display:flex;align-items:center;justify-content:space-between;width:100%;position:relative;z-index:1}.num{color:var(--lime);font-size:1.05rem;font-weight:900;letter-spacing:.08em}.back .num{color:#146181}.pill{padding:.45rem .75rem;border:1px solid rgba(255,255,255,.22);border-radius:99px;background:rgba(255,255,255,.08);font-size:.73rem;font-weight:800}.back .pill{border-color:#d0dde2;background:#eef4f6;color:#466672}.name{position:relative;z-index:1;max-width:90%;margin:auto 0;font-size:clamp(2.35rem,9vw,4rem);font-weight:850;letter-spacing:-.06em;line-height:.96;text-align:left}.hint{position:relative;z-index:1;color:rgba(255,255,255,.66);font-size:.78rem;font-weight:700}.back .hint{margin-top:auto;color:#6b818b}.back h2{margin:2.1rem 0 1.5rem;font-size:2rem;letter-spacing:-.045em}.label{margin:0 0 .35rem;color:#146181;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.text{margin:0 0 1.35rem;color:#294957;font-size:1rem;font-weight:550;line-height:1.55;text-align:left}.swipe-face{position:absolute;top:1rem;z-index:8;display:grid;place-items:center;width:4.1rem;height:4.1rem;border-radius:50%;font-size:2.2rem;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:0}.swipe-face.good{left:1rem;background:#39bd78}.swipe-face.bad{right:1rem;background:#ee5b61}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.55rem}.action{display:flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.6rem;border:0;border-radius:1rem;color:white;font-size:.84rem;font-weight:850;cursor:pointer;box-shadow:0 8px 20px rgba(12,48,65,.12)}.action b{font-size:1.8rem;line-height:1}.bad-btn{background:var(--red)}.good-btn{background:var(--green)}.swipe-hint{display:flex;justify-content:center;gap:.7rem;margin:.85rem 0 0;color:#738a94;font-size:.76rem;font-weight:750}
    .results{padding:3rem 1.3rem 2rem;border-radius:1.65rem;background:white;text-align:center;box-shadow:0 20px 50px rgba(12,48,65,.14)}.result-icon{display:grid;place-items:center;width:4rem;height:4rem;margin:0 auto 1.25rem;border-radius:50%;background:var(--lime);font-size:2rem;font-weight:900}.results h2{margin:.35rem 0 1.5rem;font-size:1.8rem}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.result-box{display:flex;flex-direction:column;gap:.25rem;padding:1rem .5rem;border-radius:1rem}.result-box strong{font-size:2rem}.result-box span{font-size:.75rem;font-weight:800}.result-box.good{background:#dcf7e9;color:#08683a}.result-box.bad{background:#ffe7e8;color:#a5262d}.restart{margin-top:1.4rem;padding:.85rem 1.15rem;border:0;border-radius:.85rem;background:var(--navy);color:white;font-weight:850;cursor:pointer}
    .overview{width:min(calc(100% - 2rem),720px);margin:3rem auto 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:.9rem}.section-head h2{margin:0;font-size:1.45rem}.section-head>span{padding:.35rem .65rem;border-radius:99px;background:#dbe6ea;color:#526e7a;font-size:.72rem;font-weight:850}.list{display:grid;gap:.5rem}.row{display:grid;grid-template-columns:2.6rem 1fr auto 2rem;align-items:center;gap:.65rem;width:100%;min-height:3.7rem;padding:.6rem .75rem;border:1px solid #d2dee3;border-radius:.9rem;background:rgba(255,255,255,.86);color:inherit;text-align:left;cursor:pointer}.row.active{border-color:var(--blue);background:#e7f3f7;box-shadow:inset 3px 0 var(--blue)}.row.good{background:#edfaf3}.row.bad{background:#fff2f2}.row-num{color:#68818c;font-size:.72rem;font-weight:900}.row-name{font-size:.9rem;font-weight:850}.row-cat{color:#6b818b;font-size:.72rem;font-weight:700}.row-status{text-align:center}
    @media(max-width:520px){header,.workspace,.overview{width:min(calc(100% - 1.25rem),720px)}header{padding-top:.8rem}.deck{height:min(52svh,440px);min-height:355px}.face{padding:1.25rem}.back h2{margin:1.65rem 0 1.1rem;font-size:1.75rem}.text{font-size:.94rem;line-height:1.45;margin-bottom:1rem}.action{flex-direction:column;gap:.05rem}.row-cat{display:none}.row{grid-template-columns:2.2rem 1fr 2rem}}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="mark">DP</div><div><p class="eyebrow">Dometic Tidaholm</p><h1>Processkort</h1></div><div class="count"><b id="count">1</b><span>/10</span></div></header>
  <section class="workspace" id="workspace"></section>
  <section class="overview"><div class="section-head"><div><p class="eyebrow">Översikt</p><h2>Alla processer</h2></div><span>10 st</span></div><div class="list" id="list"></div></section>
</main>
<script>
const data=[
["01","Termoformning","Formning","Plastskivan värms och formas till rätt geometri i ett verktyg.","Rätt temperatur, stabil cykeltid och så korta ställ som möjligt."],
["02","Limning","Sammanfogning","Komponenter sammanfogas med kontrollerad limmängd och position.","Ren yta, rätt limbild och säker härdtid före nästa processteg."],
["03","Robotfräsning","Bearbetning","Robotcellen fräser konturer och hål enligt produktens program.","Rätt program, fungerande fixtur och jämn kvalitet på båda borden."],
["04","Rengöring","Ytbehandling","Detaljerna rengörs efter fräsning innan montering och kontroll.","Ta bort spån och damm utan att repa eller skada ytan."],
["05","Gummiskärning","Förberedelse","Gummiprofiler kapas till rätt längd för produktens tätning.","Korrekt längd, rent snitt och material på rätt plats i rätt tid."],
["06","Montering","Assembly","Delar, tätningar och beslag monteras till en komplett produkt.","Standardiserat arbete, ergonomi och kvalitet i varje moment."],
["07","Etikettering","Spårbarhet","Produkten märks med korrekt etikett och information.","Rätt etikett på rätt variant – verifiera innan produkten går vidare."],
["08","Kvalitetskontroll","Kvalitet","Kritiska mått, funktion och visuella krav kontrolleras.","Hitta avvikelser direkt och stoppa felet nära den process där det uppstår."],
["09","Packning","Utleverans","Godkända produkter skyddas och packas för vidare leverans.","Rätt emballage, antal och märkning utan transportskador."],
["10","Materialförsörjning","Logistik","Material levereras till rätt process utifrån det verkliga behovet.","Korta svarstider, färre tomkörningar och tydlig status i flödet."]
];
let index=0,good=[],bad=[],flipped=false,drag=0,start=0,moved=false,exiting=false;
const work=document.querySelector("#workspace"),list=document.querySelector("#list"),count=document.querySelector("#count");
function rows(){list.innerHTML=data.map((p,i)=>`<button class="row ${i===index?"active":""} ${good.includes(i)?"good":bad.includes(i)?"bad":""}" data-i="${i}"><span class="row-num">${p[0]}</span><span class="row-name">${p[1]}</span><span class="row-cat">${p[2]}</span><span class="row-status">${good.includes(i)?"🙂":bad.includes(i)?"☹️":"›"}</span></button>`).join("");list.querySelectorAll(".row").forEach(b=>b.onclick=()=>{index=+b.dataset.i;flipped=false;drag=0;exiting=false;render()})}
function render(){
 count.textContent=Math.min(index+1,10);rows();
 if(index>=data.length){work.innerHTML=`<section class="results"><div class="result-icon">✓</div><p class="eyebrow">Klart</p><h2>10 processer bedömda</h2><div class="result-grid"><div class="result-box good"><strong>${good.length}</strong><span>Fungerar bra</span></div><div class="result-box bad"><strong>${bad.length}</strong><span>Behöver förbättras</span></div></div><button class="restart">↻ &nbsp; Börja om</button></section>`;work.querySelector(".restart").onclick=()=>{index=0;good=[];bad=[];render()};return}
 const p=data[index],n=data[index+1];
 work.innerHTML=`<div class="progress"><i style="width:${(index+1)*10}%"></i></div><div class="deck">${n?'<div class="next"></div>':""}<button class="card ${flipped?"flipped":""}" aria-label="Vänd kortet"><span class="swipe-face good">🙂</span><span class="swipe-face bad">☹️</span><span class="inner"><span class="face front"><span class="topline"><span class="num">${p[0]}</span><span class="pill">${p[2]}</span></span><span class="name">${p[1]}</span><span class="hint">Tryck för att vända</span></span><span class="face back"><span class="topline"><span class="num">${p[0]}</span><span class="pill">${p[2]}</span></span><h2>${p[1]}</h2><span class="label">Vad händer?</span><span class="text">${p[3]}</span><span class="label">Viktigt i processen</span><span class="text">${p[4]}</span><span class="hint">Tryck för framsidan</span></span></span></button></div><div class="actions"><button class="action bad-btn"><b>×</b><span>Behöver förbättras</span></button><button class="action good-btn"><b>✓</b><span>Fungerar bra</span></button></div><p class="swipe-hint"><span>←</span> Svep för att bedöma <span>→</span></p>`;
 bind()
}
function vote(dir){if(exiting||index>=data.length)return;exiting=true;if(dir==="right"){good=[...new Set([...good,index])];bad=bad.filter(i=>i!==index)}else{bad=[...new Set([...bad,index])];good=good.filter(i=>i!==index)}const card=work.querySelector(".card"),emoji=card.querySelector(dir==="right"?".swipe-face.good":".swipe-face.bad");emoji.style.opacity=1;card.style.transition="transform .38s cubic-bezier(.2,.75,.2,1)";card.style.transform=`translateX(${dir==="right"?"145vw":"-145vw"}) rotate(${dir==="right"?22:-22}deg)`;setTimeout(()=>{index++;flipped=false;drag=0;exiting=false;render()},380)}
function bind(){const card=work.querySelector(".card");card.onpointerdown=e=>{if(exiting)return;start=e.clientX;moved=false;card.setPointerCapture(e.pointerId)};card.onpointermove=e=>{if(!card.hasPointerCapture(e.pointerId)||exiting)return;drag=Math.max(-170,Math.min(170,e.clientX-start));if(Math.abs(drag)>7)moved=true;card.style.transition="none";card.style.transform=`translateX(${drag}px) rotate(${drag/18}deg)`;card.querySelector(".swipe-face.good").style.opacity=drag>10?Math.min(drag/90,1):0;card.querySelector(".swipe-face.bad").style.opacity=drag<-10?Math.min(-drag/90,1):0};card.onpointerup=()=>{if(Math.abs(drag)>85)vote(drag>0?"right":"left");else{card.style.transition="transform .38s";card.style.transform="";card.querySelectorAll(".swipe-face").forEach(x=>x.style.opacity=0);drag=0}};card.onclick=()=>{if(!moved&&!exiting){flipped=!flipped;card.classList.toggle("flipped",flipped)}moved=false};work.querySelector(".bad-btn").onclick=()=>vote("left");work.querySelector(".good-btn").onclick=()=>vote("right")}
document.onkeydown=e=>{if(e.key==="ArrowLeft")vote("left");if(e.key==="ArrowRight")vote("right");if(e.key===" "&&index<data.length){e.preventDefault();flipped=!flipped;work.querySelector(".card")?.classList.toggle("flipped",flipped)}};render();
</script>
</body>
</html>
