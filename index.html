<script>
const cards=[
{c:"Historia",t:"Lean har sina rötter i Toyota Production System",f:"Lean som lednings- och produktionsfilosofi växte fram ur Toyotas sätt att bygga kvalitet, flöde och problemlösning.",e:"Toyota Production System, TPS, utvecklades successivt i Japan efter andra världskriget. Det kombinerade idéer om flöde, kvalitet i processen och att producera efter verkligt behov.",p:["TPS brukar beskrivas med två huvudpelare: Just-in-Time och Jidoka.","Taiichi Ohno är en av de mest kända personerna bakom systemets utveckling.","Lean är bredare än en verktygslåda – det handlar om hur verksamheten styrs och förbättras."],a:"Kopiera inte bara Toyotas verktyg. Förstå vilket problem varje princip löser."},
{c:"Historia",t:"Begreppet “Lean Production” slog igenom 1990",f:"Boken The Machine That Changed the World gjorde uttrycket Lean Production känt internationellt.",e:"Forskare inom MIT:s International Motor Vehicle Program jämförde bilindustrins produktionssystem och beskrev Toyotas system som betydligt resurssnålare än traditionell massproduktion.",p:["Boken publicerades 1990 av James P. Womack, Daniel T. Jones och Daniel Roos.","Ordet “lean” syftade på att skapa mer värde med mindre resurser.","Senare utvecklades tankarna till fem Lean-principer."],a:"Lean betyder inte att pressa människor hårdare. Målet är att ta bort sådant som inte skapar värde."},
{c:"Princip",t:"Kundvärde är utgångspunkten",f:"En aktivitet är bara värdeskapande om den faktiskt förändrar produkten eller tjänsten på ett sätt kunden värderar.",e:"Lean börjar med att definiera värde ur kundens perspektiv. Därefter försöker man separera värdeskapande arbete från väntan, omarbete, transporter och andra förluster.",p:["Värde måste definieras för en specifik produkt eller tjänst.","Kundens behov styr vad som är viktigt – inte intern vana.","Allt icke-värdeskapande kan inte tas bort direkt, men det ska ifrågasättas."],a:"Fråga på golvet: Skulle kunden vilja betala för just detta steg?"},
{c:"Princip",t:"De fem Lean-principerna",f:"Värde → värdeflöde → flöde → pull → perfektion.",e:"Womack och Jones formulerade fem principer som en enkel struktur för Lean transformation.",p:["Definiera kundvärde.","Identifiera hela värdeflödet och skapa kontinuerligt flöde.","Låt kundbehov dra produktionen och förbättra systemet kontinuerligt mot perfektion."],a:"Principerna är en riktning. Verktygen väljs först efter att problemet är förstått."},
{c:"Förlust",t:"Muda betyder slöseri",f:"Muda är aktiviteter som förbrukar resurser utan att skapa värde för kunden.",e:"I Lean används Muda för att synliggöra onödigt arbete. Målet är att identifiera orsaken till slöseriet och förändra systemet – inte att skylla på individen.",p:["Exempel är väntan, överproduktion och onödiga transporter.","Slöseri kan finnas i både material- och informationsflöden.","Synligt slöseri är ofta ett symptom på ett djupare problem."],a:"När du hittar Muda: fråga vad i systemet som gör den nödvändig."},
{c:"Förlust",t:"Lean tittar även på Mura och Muri",f:"Ojämnhet och överbelastning skapar ofta mer slöseri än man först ser.",e:"Mura betyder ojämnhet och Muri betyder överbelastning. Ett system kan därför se effektivt ut lokalt men ändå skapa köer, stress, fel och störningar.",p:["Mura: variation och ojämn arbetsbelastning.","Muri: krav som överstiger människans eller utrustningens rimliga kapacitet.","Muda, Mura och Muri hänger ihop och bör angripas tillsammans."],a:"Jämna ut flödet innan du jagar varje sekund i en enskild station."},
{c:"Förlust",t:"De 8 slöserierna används som observationsstöd",f:"Transport, lager, rörelse, väntan, överproduktion, överprocessning, fel och outnyttjad kompetens.",e:"Listan hjälper team att upptäcka förluster. Den är ett observationsverktyg, inte ett mål i sig.",p:["De första sju kommer från klassiska TPS-beskrivningar.","Outnyttjad kompetens läggs ofta till som det åttonde slöseriet.","Överproduktion kallas ofta det allvarligaste eftersom den driver lager och döljer problem."],a:"Gör en 15-minuters observation och markera vilket slöseri du faktiskt ser – inte vilket du tror finns."},
{c:"Flöde",t:"Överproduktion är extra farligt",f:"Att producera tidigare eller mer än behovet skapar lager och döljer problem.",e:"Överproduktion låser kapital, kräver yta, skapar extra hantering och gör det svårare att se kvalitetsproblem snabbt.",p:["Mer WIP betyder ofta längre ledtid.","Extra lager kan dölja instabilitet och flaskhalsar.","Pull-system försöker begränsa produktion utan verklig efterfrågan."],a:"Fråga: Vad skulle hända om vi slutade producera till nästa process innan den faktiskt behöver materialet?"},
{c:"Flöde",t:"Little’s Law kopplar WIP till ledtid",f:"I ett stabilt system gäller ungefär: WIP = genomflöde × ledtid.",e:"Det betyder att mycket arbete i processen normalt ger längre genomloppstid om genomflödet är oförändrat.",p:["WIP är antal enheter som befinner sig i systemet.","Genomflöde är hur många enheter som blir klara per tidsenhet.","Att begränsa WIP är därför ett kraftfullt sätt att angripa ledtid."],a:"Vill du halvera ledtiden? Börja med att se om mängden WIP kan halveras utan att stoppa flödet."},
{c:"Flöde",t:"One-piece flow gör problem synliga snabbare",f:"När produkter rör sig styckvis eller i små batcher upptäcks störningar tidigare än i stora batcher.",e:"Kontinuerligt flöde minskar väntan mellan processteg och gör kvalitetsproblem synliga närmare orsaken.",p:["Små batcher minskar köer och mellanlager.","Problem når nästa process snabbare – vilket är bra om organisationen agerar på dem.","Flöde kräver stabila processer och rimligt balanserat arbete."],a:"Målet är inte alltid exakt batchstorlek 1. Målet är minsta praktiska batch som ger bra flöde."},
{c:"Flöde",t:"Takt time kommer från kundbehovet",f:"Takt = tillgänglig produktionstid ÷ kundens efterfrågan.",e:"Takt time beskriver den takt som produktionen i genomsnitt behöver hålla för att möta efterfrågan under den valda perioden.",p:["Takt är inte samma sak som cykeltid.","Om cykeltiden är högre än takt behövs en åtgärd för att klara behovet.","Takt hjälper till att balansera arbete och visualisera avvikelser."],a:"Använd takt som kundens rytm – inte som ett verktyg för att stressa operatören."},
{c:"Pull",t:"Pull betyder att behovet drar produktionen",f:"Nästa process signalerar vad som behövs, i stället för att föregående process trycker fram mer.",e:"Pull hjälper till att minska överproduktion och WIP genom att koppla produktionen närmare faktisk förbrukning.",p:["Pull kräver tydliga signaler och begränsningar.","Kanban är ett vanligt sätt att styra ett pull-system.","Ett pull-system fungerar bäst när processerna är relativt stabila."],a:"Produktion utan en tydlig förbrukningssignal är ofta ett tecken på push."},
{c:"Pull",t:"Kanban är en signal – inte bara en tavla",f:"Kanban betyder ungefär visuellt kort eller signal och används för att styra påfyllnad och produktion.",e:"Ett Kanban-system definierar när något får produceras eller fyllas på och hur mycket som ska finnas i systemet.",p:["Kanban kan vara fysiska kort, lådor, markeringar eller digitala signaler.","Antalet Kanban begränsar normalt WIP.","Ett trasigt Kanban-system märks när material produceras utan signal eller reglerna kringgås."],a:"Bra Kanban svarar på tre frågor: Vad? Hur mycket? När får vi fylla på?"},
{c:"Kvalitet",t:"Jidoka bygger in kvalitet i processen",f:"När ett problem uppstår ska processen kunna stanna eller signalera så att felet hanteras vid källan.",e:"Jidoka brukar översättas som autonomation – automation med mänsklig intelligens. Principen är äldre än Toyotas bilproduktion och kopplas till Sakichi Toyodas vävstolar.",p:["Felet ska upptäckas där det uppstår.","Processen ska inte fortsätta producera kända defekter.","Stoppet blir en signal om att orsaken måste förstås och elimineras."],a:"Ett stopp är inte misslyckande. Ett stopp som leder till lärande kan vara ett tecken på ett friskt system."},
{c:"Kvalitet",t:"Andon gör avvikelser synliga",f:"Andon är en visuell eller akustisk signal som visar att hjälp eller åtgärd behövs.",e:"En Andon-signal kan visa status för en process, maskin eller linje och göra det möjligt att reagera snabbt på avvikelser.",p:["Signalen ska leda till en definierad respons.","Andon utan tydligt ansvar blir bara ytterligare en lampa eller skärm.","Principen stödjer Jidoka: upptäck, stoppa vid behov och lös problemet."],a:"Visualisering utan reaktion är dekoration. Bestäm vem som agerar, på vad och inom vilken tid."},
{c:"Kvalitet",t:"Poka-yoke förebygger enkla fel",f:"Felsäkring utformar processen så att misstag blir svåra att göra eller upptäcks direkt.",e:"Poka-yoke används för att förebygga eller fånga fel innan de blir defekter som går vidare till kunden.",p:["Exempel: kontaktstycken som bara kan monteras åt ett håll.","Kontroll vid källan är starkare än slutkontroll.","Shigeo Shingo populariserade begreppet inom industriell kvalitetsutveckling."],a:"Försök först designa bort möjligheten att göra fel innan du lägger till fler instruktioner."},
{c:"Standard",t:"Standardiserat arbete är baslinjen för förbättring",f:"Utan en definierad bästa kända metod blir det svårt att veta om en förändring faktiskt är bättre.",e:"Standardiserat arbete beskriver hur arbetet ska utföras idag. Det är inte en evig regel utan en gemensam bas som kan förbättras.",p:["Standarden bör vara tydlig och praktiskt användbar där arbetet sker.","Avvikelser från standarden ger viktig information.","När en bättre metod bevisas ska standarden uppdateras."],a:"Standard utan förbättring blir stelbent. Förbättring utan standard blir slumpmässig."},
{c:"Förbättring",t:"Kaizen betyder kontinuerlig förbättring",f:"Små förbättringar varje dag kan tillsammans förändra hela systemet.",e:"Kaizen bygger på att människor nära processen kontinuerligt upptäcker problem, testar lösningar och standardiserar det som fungerar.",p:["Kaizen behöver inte vara stora projekt.","Förbättring blir starkare när operatörer deltar aktivt.","Ett problem ses som en möjlighet att lära om processen."],a:"Den viktigaste Kaizen-frågan är ofta: Vad hindrar oss från att göra rätt arbete enkelt varje gång?"},
{c:"Förbättring",t:"PDCA är en motor för lärande",f:"Plan → Do → Check → Act används för att testa hypoteser och förbättra processer systematiskt.",e:"PDCA har rötter i Shewharts arbete och spreds starkt genom W. Edwards Deming. I Lean används cykeln för strukturerad problemlösning och experiment.",p:["Plan: förstå nuläget och formulera en hypotes.","Do och Check: testa i liten skala och jämför utfallet mot förväntan.","Act: standardisera lärandet eller justera och testa igen."],a:"Ett förbättringsförslag utan tydlig förväntan är svårt att lära av. Skriv vad du tror kommer hända innan testet."},
{c:"Problemlösning",t:"5 Why söker orsaken bakom symptomet",f:"Genom att fråga “varför?” flera gånger försöker teamet komma bort från första, ytliga förklaringen.",e:"5 Why används för enkel rotorsaksanalys. Antalet fem är inte magiskt – poängen är att fortsätta tills man når en orsak som går att påverka i processen.",p:["Svar ska stödjas av observation och fakta.","Stanna inte vid “operatörsfel”. Fråga varför systemet gjorde felet möjligt.","Komplexa problem kan kräva mer än en orsak och fler analysmetoder."],a:"Bra 5 Why går mot processen, inte mot personen."},
{c:"Problemlösning",t:"Gå till Gemba för att förstå verkligheten",f:"Gemba är platsen där värdet faktiskt skapas – där processen sker på riktigt.",e:"Lean-ledarskap betonar direkt observation. Data är viktigt, men den ska kombineras med att se arbetet, prata med människorna och förstå verkliga förutsättningar.",p:["Gå och se processen själv.","Fråga respektfullt för att förstå, inte för att leta skyldiga.","Jämför standard, förväntat läge och faktiskt utfall."],a:"En PowerPoint om problemet är inte problemet. Gå till platsen där problemet händer."},
{c:"Problemlösning",t:"A3 gör tänkandet synligt",f:"En A3 samlar problem, nuläge, analys, mål, motåtgärder och uppföljning på en kompakt yta.",e:"A3 är både ett dokumentformat och ett sätt att strukturera problemlösning och coachning.",p:["Problembeskrivningen ska vara mätbar och konkret.","Motåtgärder ska kopplas till analyserade orsaker.","Uppföljning behövs för att se om resultatet faktiskt förbättrades."],a:"En snygg A3 utan ett tydligt resonemang är bara en snygg affisch."},
{c:"Ställtid",t:"SMED angriper ställtiden systematiskt",f:"Single-Minute Exchange of Die utvecklades för att drastiskt minska omställningstider.",e:"SMED förknippas med Shigeo Shingo. Metoden skiljer på aktiviteter som kräver stopp och sådant som kan göras medan utrustningen fortfarande kör.",p:["Separera intern och extern ställtid.","Flytta så mycket som möjligt från intern till extern tid.","Förenkla, standardisera och parallellisera återstående moment."],a:"Kortare ställtid möjliggör mindre batcher – vilket ofta förbättrar flöde och ledtid."},
{c:"Stabilitet",t:"5S handlar om arbetsplatsens grundförutsättningar",f:"Sortera, systematisera, städa, standardisera och skapa vana/disciplin.",e:"5S används för att skapa en arbetsplats där avvikelser blir synliga och det normala arbetssättet är enkelt att följa.",p:["5S är mer än städning.","Placering och standard ska stödja arbetets flöde och säkerhet.","Om 5S kräver en stor kampanj varje månad är systemet troligen inte stabilt."],a:"Bra 5S gör det lätt att se inom några sekunder om något är fel eller saknas."},
{c:"Utjämning",t:"Heijunka jämnar ut mix och volym",f:"Utjämnad produktion minskar toppar, köer och behovet av brandkårsutryckningar.",e:"Heijunka försöker skapa en jämnare produktionsrytm över tid i stället för att köra stora block av samma produkt enbart för lokal effektivitet.",p:["Utjämning minskar Mura – ojämnhet.","Kortare ställtider gör det lättare att växla mellan produkter.","Målet är ett system som reagerar bättre på efterfrågan utan stora lager."],a:"Optimal maskinutnyttjandegrad kan vara dåligt för hela flödet. Optimera systemet, inte bara resursen."},
{c:"Ledarskap",t:"Respekt för människor är central i Lean",f:"Lean fungerar bäst när människor får förutsättningar att lösa problem, utveckla standarder och förbättra arbetet.",e:"Toyota Way lyfter både continuous improvement och respect for people. Hållbar Lean bygger därför inte bara på tekniska verktyg utan även på ledarskap och utveckling av människor.",p:["Ledaren ska skapa förutsättningar för problemlösning.","Operatörens kunskap om processen är en viktig resurs.","Förbättring ska göra systemet bättre – inte bara flytta belastningen till någon annan."],a:"Det starkaste Lean-systemet är ett system där fler människor kan upptäcka, förstå och lösa problem varje dag."}
];
let i=0,flipped=false;
const stage=document.getElementById('stage'),count=document.getElementById('count'),prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const x=cards[i];flipped=false;stage.innerHTML=`<article class="card" id="card" role="button" tabindex="0" aria-label="Vänd kortet"><div class="inner"><section class="face front"><div class="meta"><span class="tag">${esc(x.c)}</span><span class="num">${String(i+1).padStart(2,'0')} / ${cards.length}</span></div><div class="hero"><div class="label">Känd Lean-fakta</div><h2>${esc(x.t)}</h2><p>${esc(x.f)}</p></div><div class="hint"><span><strong>Tryck på kortet</strong><br>för att läsa mer</span><span class="tap">↻</span></div></section><section class="face back"><span class="tag">${esc(x.c)}</span><h3>${esc(x.t)}</h3><p class="explain">${esc(x.e)}</p><div class="points">${x.p.map((v,n)=>`<div class="point"><span class="pnum">${n+1}</span><span>${esc(v)}</span></div>`).join('')}</div><div class="takeaway"><b>Ta med dig</b>${esc(x.a)}</div><div class="backHint">Tryck på kortet igen för framsidan</div></section></div></article>`;const c=document.getElementById('card');c.addEventListener('click',flip);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});count.textContent=`${i+1}/${cards.length}`;prog.style.width=`${((i+1)/cards.length)*100}%`;prev.disabled=i===0;next.textContent=i===cards.length-1?'Till början ↺':'Nästa →'}
function flip(){flipped=!flipped;document.getElementById('card')?.classList.toggle('flipped',flipped)}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{i=i===cards.length-1?0:i+1;render()};
const overlay=document.getElementById('overlay'),grid=document.getElementById('grid');
function buildGrid(){grid.innerHTML=cards.map((x,n)=>`<button class="mini" data-n="${n}"><span class="mnum">${String(n+1).padStart(2,'0')}</span><span class="mcat">${esc(x.c)}</span><b>${esc(x.t)}</b><span>${esc(x.f)}</span></button>`).join('');grid.querySelectorAll('.mini').forEach(b=>b.onclick=()=>{i=+b.dataset.n;overlay.classList.remove('open');render()})}
document.getElementById('overviewBtn').onclick=()=>{buildGrid();overlay.classList.add('open')};document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open');if(!overlay.classList.contains('open')&&e.key==='ArrowRight')next.click();if(!overlay.classList.contains('open')&&e.key==='ArrowLeft')prev.click()});
render();
</script>
</body>
</html>
