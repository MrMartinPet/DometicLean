<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Leanverktyg – Flashcards</title>
<style>
:root{--ink:#101820;--paper:#f3f5f2;--card:#fff;--green:#2f7d59;--lime:#c9e43b;--muted:#68736d;--line:#dfe5e0;--shadow:0 18px 50px rgba(16,24,32,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button{font:inherit}.app{width:min(560px,100%);height:100svh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:9px;overflow:hidden}
header{padding:0 2px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.04em;font-size:13px}.logo{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:18px}.overviewBtn{border:0;border-radius:999px;background:#fff;padding:9px 13px;font-size:12px;font-weight:900;color:var(--ink);box-shadow:0 5px 18px rgba(16,24,32,.08)}h1{margin:12px 0 3px;font-size:31px;line-height:1;letter-spacing:-.045em}.lead{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35}.progressRow{display:flex;align-items:center;gap:10px;margin-top:10px}.progress{height:6px;flex:1;border-radius:99px;background:#dce2dd;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .2s}.counter{min-width:46px;text-align:right;color:var(--muted);font-size:11px;font-weight:900}
.stage{min-height:0;perspective:1400px}.card{position:relative;width:100%;height:100%;min-height:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.22,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:25px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(16,24,32,.06)}.front{background:var(--ink);color:#fff;padding:23px;display:flex;flex-direction:column}.front:after{content:"";position:absolute;width:270px;height:270px;border:46px solid rgba(201,228,59,.12);border-radius:50%;right:-125px;top:-130px}.frontTop,.frontMain,.frontFoot{position:relative;z-index:1}.frontTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.category{display:inline-flex;width:max-content;border-radius:999px;background:var(--lime);color:#16200f;padding:6px 9px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.07em}.number{font-size:11px;color:#c7d0cc;font-weight:900}.frontMain{margin:auto 0}.frontMain h2{font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:-.05em;margin:0}.frontMain p{font-size:14px;line-height:1.45;color:#d7dfdb;margin:14px 0 0;max-width:92%}.frontFoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.16);padding-top:13px;color:#cbd5d0;font-size:11px}.flipIcon{width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px}
.back{transform:rotateY(180deg);background:#fff;padding:21px;display:flex;flex-direction:column}.backTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.backTop h3{margin:8px 0 0;font-size:clamp(22px,6vw,29px);line-height:1.04;letter-spacing:-.04em}.badge{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#edf6ef;color:var(--green);display:grid;place-items:center;font-weight:950}.description{font-size:13.5px;line-height:1.4;color:#34413a;margin:12px 0 0}.how{margin-top:13px;padding:12px 13px;border-radius:15px;background:#f3f6f3;border:1px solid var(--line)}.how b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--green);margin-bottom:5px}.how p{margin:0;font-size:12.5px;line-height:1.4;color:#3b4942}.points{display:grid;gap:7px;margin-top:12px}.point{display:grid;grid-template-columns:25px 1fr;align-items:start;gap:8px;font-size:12.2px;line-height:1.32;color:#3b4942}.dot{width:25px;height:25px;border-radius:8px;background:#edf6ef;color:var(--green);display:grid;place-items:center;font-weight:950;font-size:11px}.backFoot{margin-top:auto;border-top:1px solid var(--line);padding-top:9px;text-align:center;color:#7b8580;font-size:10.5px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{min-height:52px;border:0;border-radius:16px;background:#fff;color:var(--ink);font-weight:950;font-size:14px;box-shadow:0 5px 18px rgba(16,24,32,.07)}.nav.next{background:var(--green);color:#fff}.nav:disabled{opacity:.35}.footer{text-align:center;color:#7b8580;font-size:9.5px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,13,17,.58);padding:16px;display:none}.overlay.open{display:flex}.sheet{margin:auto;width:min(620px,100%);max-height:88svh;overflow:auto;background:#f7f8f6;border-radius:25px;padding:18px}.sheetTop{position:sticky;top:-18px;z-index:2;background:#f7f8f6;padding:1px 0 12px;display:flex;align-items:center;justify-content:space-between}.sheetTop h2{margin:0;font-size:24px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#e3e8e4;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border:0;background:#fff;border-radius:14px;padding:12px;text-align:left;min-height:92px;box-shadow:0 3px 12px rgba(16,24,32,.04)}.mini small{display:block;color:var(--green);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.mini strong{display:block;margin-top:6px;font-size:13px;line-height:1.2}.mini span{display:block;margin-top:5px;color:#78817d;font-size:10px}
@media(max-height:720px){.app{padding-top:8px;gap:7px}h1{font-size:26px;margin-top:8px}.lead{display:none}.progressRow{margin-top:7px}.front{padding:19px}.frontMain h2{font-size:31px}.frontMain p{font-size:12.5px}.back{padding:17px 18px}.backTop h3{font-size:22px}.description{font-size:12.1px;line-height:1.32;margin-top:8px}.how{margin-top:8px;padding:9px 10px}.how p{font-size:11.2px;line-height:1.3}.points{margin-top:8px;gap:5px}.point{font-size:10.8px;line-height:1.25;grid-template-columns:22px 1fr}.dot{width:22px;height:22px}.backFoot{padding-top:6px;font-size:9.5px}.nav{min-height:47px}.footer{font-size:9px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.front{padding:19px}.back{padding:17px 18px}.frontMain h2{font-size:31px}.description{font-size:12.5px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><div class="brand"><span class="logo">↗</span> LEAN TOOLBOX</div><button class="overviewBtn" id="overviewBtn">☷ Översikt</button></div>
<h1>Leanverktyg på kort.</h1><p class="lead">Tryck på kortet för att vända det och få en enkel förklaring.</p>
<div class="progressRow"><div class="progress"><i id="progress"></i></div><div class="counter" id="counter"></div></div>
</header>
<main class="stage"><article class="card" id="card" tabindex="0" role="button" aria-label="Vänd kort"><div class="inner" id="inner"></div></article></main>
<nav class="controls"><button class="nav" id="prev">← Föregående</button><button class="nav next" id="next">Nästa →</button></nav>
<div class="footer">Klicka/tappa på kortet för att vända · ingen swipe</div>
</div>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheetTop"><h2>Alla leanverktyg</h2><button class="close" id="close" aria-label="Stäng">×</button></div><div class="grid" id="grid"></div></section></div>
<script>
const cards=[
{n:"20 Cycle Check",c:"Mätning",f:"Mät 20 cykler för att se verklig cykeltid och variation.",d:"En enkel observationsstudie där samma arbetscykel mäts flera gånger. Den visar om processen är stabil och om standardtiden stämmer med verkligheten.",h:"Mät 20 cykler i följd. Notera avvikelser – inte bara medelvärdet.",p:["Synliggör variation mellan cykler.","Bra underlag för Standard Work.","Fråga varför toppar och dalar uppstår."]},
{n:"Fiskbensdiagram",c:"Problemlösning",f:"Strukturera möjliga orsaker till ett problem.",d:"Även kallat Ishikawa-diagram. Orsaker sorteras ofta under kategorier som människa, maskin, metod, material, miljö och mätning.",h:"Skriv problemet i fiskens huvud och brainstorma möjliga orsaker i grenarna.",p:["Skapar struktur i analysen.","Bra när många faktorer kan påverka.","Verifiera orsaker med fakta efteråt."]},
{n:"5 Varför",c:"Problemlösning",f:"Fråga varför flera gånger för att nå bakom symptomet.",d:"5 Varför hjälper teamet att gå från det synliga felet mot en bakomliggande orsak. Fem är en tumregel – ibland behövs färre eller fler frågor.",h:"Utgå från ett konkret problem. Fråga varför, och låt varje svar bli nästa fråga.",p:["Fokusera på process – inte person.","Stöd svaren med fakta.","Sluta inte vid första rimliga förklaringen."]},
{n:"5S",c:"Arbetsplats",f:"Skapa en tydlig, säker och stabil arbetsplats.",d:"5S står för Sortera, Systematisera, Städa, Standardisera och Skapa vana. Målet är inte snyggt – målet är att avvikelser ska bli tydliga.",h:"Ta bort det onödiga, ge allt en bestämd plats och bygg en enkel standard som följs.",p:["Minskar letande och onödig rörelse.","Gör avvikelser synliga snabbare.","Kräver återkommande uppföljning."]},
{n:"Kaizen",c:"Förbättring",f:"Små, kontinuerliga förbättringar nära arbetet.",d:"Kaizen bygger på att de som kan processen också deltar i att förbättra den. Fokus ligger på många små steg snarare än att vänta på ett stort projekt.",h:"Identifiera ett litet problem, testa en förbättring, följ upp resultatet och standardisera det som fungerar.",p:["Gör förbättring till vardagsarbete.","Engagerar operatörer och team.","Små vinster kan ge stor total effekt."]},
{n:"VSM",c:"Flöde",f:"Kartlägg hela värdeflödet – material och information.",d:"Value Stream Mapping visar hur en produkt eller tjänst rör sig från behov till leverans. Den synliggör väntan, lager, informationsflöden och processtider.",h:"Rita nuläget först. Markera förluster. Skapa sedan ett realistiskt framtida läge.",p:["Se helheten – inte en enskild maskin.","Ledtid är ofta viktigare än processtid.","Koppla åtgärder till framtida flöde."]},
{n:"Poka-Yoke",c:"Kvalitet",f:"Gör det svårt att göra fel – eller lätt att upptäcka det.",d:"Poka-Yoke är felsäkring. Lösningen ska helst förebygga felet direkt i processen i stället för att förlita sig på kontroll i efterhand.",h:"Utgå från ett återkommande fel och bygg bort möjligheten att göra fel med en enkel fysisk eller digital lösning.",p:["Förebygga är bättre än inspektera.","Enkel teknik räcker ofta.","Bra lösningar ger snabb återkoppling."]},
{n:"SMED",c:"Ställtid",f:"Minska ställtiden och gör mindre batcher möjliga.",d:"Single-Minute Exchange of Die är en metod för systematisk ställtidsreduktion. Kärnan är att separera interna och externa ställmoment.",h:"Filma ett ställ. Flytta arbete från stoppad maskin till före/efter stoppet och förenkla varje moment.",p:["Separera internt och externt arbete.","Eliminera justering och letande.","Standardisera den nya ställmetoden."]},
{n:"OEE",c:"Utrustning",f:"Mät hur effektivt en utrustning faktiskt används.",d:"Overall Equipment Effectiveness kombinerar Tillgänglighet × Prestanda × Kvalitet. Resultatet visar hur stor del av planerad tid som blir godkänd produktion i rätt takt.",h:"Bryt alltid ned OEE i de tre faktorerna – totalsiffran ensam säger inte vad som ska förbättras.",p:["Tillgänglighet: stoppförluster.","Prestanda: hastighetsförluster.","Kvalitet: kassation och omarbete."]},
{n:"Standard Work",c:"Standard",f:"Bästa kända arbetssättet – just nu.",d:"Standardiserat arbete beskriver hur ett arbete ska utföras säkert, med rätt kvalitet och i rätt takt. Standarden är baslinjen för nästa förbättring.",h:"Definiera arbetssekvens, takt/cykeltid och nödvändigt standard-WIP tillsammans med dem som gör jobbet.",p:["Ingen stabil förbättring utan standard.","Standard ska vara tydlig och praktisk.","När bättre metod finns – uppdatera standarden."]},
{n:"Gemba Walk",c:"Ledarskap",f:"Gå dit arbetet sker och förstå verkligheten.",d:"Gemba betyder den verkliga platsen. Syftet är att observera processen, prata med människorna och förstå fakta innan man drar slutsatser.",h:"Gå med ett tydligt syfte. Observera först, ställ öppna frågor och undvik att hoppa direkt till lösningar.",p:["Se processen med egna ögon.","Respektera dem som gör arbetet.","Leta efter systemproblem – inte syndabockar."]},
{n:"Kanban",c:"Pull",f:"Visuell signal som styr påfyllnad efter behov.",d:"Kanban hjälper ett pull-system att styra vad som ska produceras eller fyllas på, i vilken mängd och när. Det begränsar samtidigt WIP.",h:"Bestäm tydliga signaler och maxnivåer. Produktion eller påfyllnad startar först när signalen finns.",p:["Kopplar arbete till verklig förbrukning.","Begränsar överproduktion och WIP.","Kräver stabila regler och disciplin."]},
{n:"Heijunka",c:"Utjämning",f:"Jämna ut volym och mix för stabilare flöde.",d:"Heijunka minskar toppar och dalar i produktionen. Ett jämnare behov gör det lättare att bemanna, planera och upptäcka verkliga kapacitetsproblem.",h:"Bryt ned stora produktionsblock till mindre, återkommande sekvenser där det är möjligt.",p:["Minskar Mura – ojämnhet.","Kan minska lager och väntan.","Ställer krav på korta ställtider."]},
{n:"Jidoka / Andon",c:"Kvalitet",f:"Stoppa och synliggör när processen inte är normal.",d:"Jidoka bygger in kvalitet i processen. Andon gör avvikelsen synlig så att rätt stöd kan komma snabbt och felet inte fortsätter vidare.",h:"Definiera vad som är en avvikelse, hur den signaleras och vem som reagerar på signalen.",p:["Problem ska bli synliga direkt.","Stoppa hellre än att bygga vidare på fel.","Lös orsaken och återställ stabil process."]},
{n:"Takttid",c:"Flöde",f:"Den takt kunden kräver av processen.",d:"Takttid beräknas som tillgänglig produktionstid delat med kundbehov. Den används för att dimensionera och balansera arbetet mot efterfrågan.",h:"Räkna på verkligt tillgänglig tid och relevant kundbehov. Jämför sedan med cykeltiderna i processen.",p:["Takt kommer från kundbehovet.","Takt är inte samma sak som cykeltid.","Bra grund för linjebalansering."]},
{n:"Yamazumi",c:"Balansering",f:"Stapla arbetsmoment och balansera mot takt.",d:"Ett Yamazumi-diagram visar arbetsinnehåll per operatör eller station som staplar. Det gör obalans och förbättringsmöjligheter visuellt tydliga.",h:"Mät arbetsmoment, sortera dem och jämför varje stapel mot takttiden.",p:["Synliggör över- och underbelastning.","Stöd för omfördelning av arbete.","Använd fakta från verkliga cykler."]},
{n:"PDCA",c:"Förbättring",f:"Planera, testa, studera resultatet och agera.",d:"Plan–Do–Check–Act är en enkel lärloop för förbättring. Tanken är att testa hypoteser i liten skala och lära sig innan en lösning standardiseras brett.",h:"Planera ett test, genomför det, jämför utfallet med förväntan och bestäm nästa steg.",p:["Behandla förbättring som experiment.","Mät före och efter.","Standardisera eller justera utifrån lärdom."]},
{n:"A3",c:"Problemlösning",f:"Samla problemet, analysen och planen på en sida.",d:"A3 är mer än ett dokumentformat. Det är ett strukturerat tankesätt som kopplar bakgrund, nuläge, mål, orsaksanalys, motåtgärder och uppföljning.",h:"Bygg A3:an tillsammans med berörda och låt fakta styra berättelsen från problem till motåtgärd.",p:["Gör resonemanget synligt.","Skilj orsak från motåtgärd.","Följ upp om effekten verkligen kom."]},
{n:"Spaghettidiagram",c:"Rörelse",f:"Rita den faktiska vägen för människor eller material.",d:"Ett spaghettidiagram visar hur mycket rörelse och transport som gömmer sig i en layout. Linjen ritas efter verklig förflyttning under en vald period.",h:"Följ en person, produkt eller transport och rita varje förflyttning på layouten. Mät gärna total sträcka.",p:["Synliggör onödig rörelse.","Bra stöd vid layoutförändringar.","Jämför före och efter förbättring."]},
{n:"Pareto",c:"Prioritering",f:"Fokusera först på de få orsaker som står för mest effekt.",d:"Ett Pareto-diagram sorterar problem eller förluster från störst till minst. Det hjälper teamet att prioritera där förbättringsinsatsen kan ge störst resultat.",h:"Samla data per feltyp eller förlust, sortera fallande och välj den största relevanta kategorin först.",p:["Prioritera med data – inte känsla.","20/80 är en princip, inte en lag.","Gör ny Pareto när läget förändrats."]}
];
let index=0;
const card=document.getElementById('card'),inner=document.getElementById('inner'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),overlay=document.getElementById('overlay'),grid=document.getElementById('grid');
function render(){const x=cards[index];card.classList.remove('flipped');inner.innerHTML=`<section class="face front"><div class="frontTop"><span class="category">${x.c}</span><span class="number">${String(index+1).padStart(2,'0')} / ${cards.length}</span></div><div class="frontMain"><h2>${x.n}</h2><p>${x.f}</p></div><div class="frontFoot"><span>Tryck för förklaring</span><span class="flipIcon">↻</span></div></section><section class="face back"><div class="backTop"><div><span class="category">${x.c}</span><h3>${x.n}</h3></div><div class="badge">✓</div></div><p class="description">${x.d}</p><div class="how"><b>Så används det</b><p>${x.h}</p></div><div class="points">${x.p.map((p,i)=>`<div class="point"><span class="dot">${i+1}</span><span>${p}</span></div>`).join('')}</div><div class="backFoot">Tryck på kortet för att vända tillbaka</div></section>`;counter.textContent=`${index+1} / ${cards.length}`;progress.style.width=`${(index+1)/cards.length*100}%`;prev.disabled=index===0;next.disabled=index===cards.length-1}
function flip(){card.classList.toggle('flipped')}
function go(i){if(i<0||i>=cards.length)return;index=i;render()}
card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});prev.onclick=()=>go(index-1);next.onclick=()=>go(index+1);
document.getElementById('overviewBtn').onclick=()=>overlay.classList.add('open');document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});
cards.forEach((x,i)=>{const b=document.createElement('button');b.className='mini';b.innerHTML=`<small>${String(i+1).padStart(2,'0')} · ${x.c}</small><strong>${x.n}</strong><span>${x.f}</span>`;b.onclick=()=>{index=i;render();overlay.classList.remove('open')};grid.appendChild(b)});
render();
</script>
</body>
</html>
