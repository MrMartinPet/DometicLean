<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231d">
<title>Lean Facts</title>
<style>
:root{--dark:#10231d;--green:#1f8f62;--yellow:#f2bf19;--bg:#eef3ef;--muted:#6b7b73;--line:#dce4df}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--dark)}button{font:inherit}.app{max-width:540px;height:100svh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}header{padding:0 2px 8px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:950;letter-spacing:.05em}.mark{width:30px;height:30px;border-radius:9px;background:var(--yellow);display:grid;place-items:center;font-size:17px}.overview{border:0;background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;color:#26382f;box-shadow:0 5px 16px rgba(15,35,28,.07)}.eyebrow{margin-top:11px;font-size:10.5px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}h1{margin:3px 0 0;font-size:29px;line-height:1;letter-spacing:-.045em}.sub{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}.progressRow{display:flex;align-items:center;gap:9px;margin-top:9px}.progress{height:5px;flex:1;background:#d8e0db;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--yellow);transition:width .2s}.count{min-width:42px;text-align:right;font-size:11px;font-weight:900;color:#66756d}.stage{min-height:0;display:flex;align-items:stretch;padding:4px 0 7px}.card{width:100%;height:100%;min-height:0;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.face{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:0 16px 45px rgba(15,35,28,.15);border:1px solid rgba(16,35,29,.07);backface-visibility:hidden!important;-webkit-backface-visibility:hidden!important;will-change:transform,opacity}.front{z-index:2;background:var(--dark);color:#fff;padding:22px;display:flex;flex-direction:column;transform:perspective(1200px) rotateY(0);opacity:1;transition:transform .24s ease,opacity .06s linear .12s}.back{z-index:1;background:#fff;padding:20px 21px;display:flex;flex-direction:column;transform:perspective(1200px) rotateY(-90deg);opacity:0;pointer-events:none;transition:transform .24s ease,opacity .06s linear}.card.flipped .front{z-index:1;transform:perspective(1200px) rotateY(90deg);opacity:0;pointer-events:none;transition:transform .24s ease,opacity .06s linear}.card.flipped .back{z-index:2;transform:perspective(1200px) rotateY(0);opacity:1;pointer-events:auto;transition:transform .24s ease,opacity .06s linear .12s}.front:after{content:"";position:absolute;right:-95px;top:-90px;width:220px;height:220px;border:42px solid rgba(242,191,25,.12);border-radius:50%}.meta{position:relative;z-index:2;display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-flex;align-items:center;width:max-content;font-size:10px;font-weight:950;letter-spacing:.07em;text-transform:uppercase;background:var(--yellow);color:#111;padding:6px 9px;border-radius:999px}.num{font-size:11px;font-weight:900;color:#bac7c0}.hero{position:relative;z-index:2;margin:auto 0}.hero h2{margin:0;font-size:clamp(28px,8vw,37px);line-height:1.02;letter-spacing:-.045em}.hero p{margin:13px 0 0;max-width:96%;color:#d4ded9;font-size:14px;line-height:1.4}.hint{position:relative;z-index:2;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;align-items:center;color:#c5d0ca;font-size:11px}.hint b{color:#fff}.tap{width:35px;height:35px;border:1px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center}.backTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.back h3{margin:8px 0 0;font-size:clamp(21px,6vw,27px);line-height:1.05;letter-spacing:-.035em}.definition{margin:11px 0 0;color:#3d4e46;font-size:13.5px;line-height:1.38}.facts{display:grid;gap:7px;margin-top:12px}.fact{display:grid;grid-template-columns:27px 1fr;gap:8px;align-items:start;color:#3b4c44;font-size:12.5px;line-height:1.34}.factNo{width:27px;height:27px;border-radius:9px;background:#ebf5f0;color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:950}.takeaway{margin-top:12px;padding:11px 12px;border-radius:14px;background:#fff7d6;border:1px solid #eddb82;font-size:12.5px;line-height:1.34}.takeaway b{display:block;margin-bottom:3px;color:#766000;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}.backHint{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);color:#7b8a82;font-size:10.5px;text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:1px}.nav{min-height:52px;border:0;border-radius:16px;background:#fff;color:#25372f;font-size:14px;font-weight:950;box-shadow:0 6px 18px rgba(15,35,28,.08)}.nav.next{background:var(--dark);color:#fff}.nav:disabled{opacity:.35}.footer{text-align:center;color:#7b8a82;font-size:9.5px;padding-top:6px}.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,20,16,.56);display:none;padding:16px}.overlay.open{display:flex}.sheet{margin:auto;width:min(610px,100%);max-height:88svh;background:#f7f9f7;border-radius:25px;padding:18px;overflow:auto}.sheetTop{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#f7f9f7;padding:2px 0 12px;z-index:2}.sheet h2{margin:0;font-size:23px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#e4ebe7;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border:0;background:#fff;border-radius:14px;padding:12px;text-align:left;min-height:92px}.mini small{display:block;color:var(--green);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.mini b{display:block;margin-top:6px;font-size:13px;line-height:1.18}.mini span{display:block;margin-top:5px;color:#7b8982;font-size:10px}.compact .definition{font-size:12.7px}.compact .fact{font-size:11.8px;line-height:1.28}.compact .facts{gap:6px;margin-top:10px}.compact .takeaway{font-size:11.8px;margin-top:10px;padding:10px 11px}@media(max-height:700px){.app{padding-top:8px}.sub{display:none}.eyebrow{margin-top:7px}h1{font-size:25px}.progressRow{margin-top:7px}.stage{padding-top:2px}.front{padding:19px}.back{padding:17px 18px}.hero h2{font-size:29px}.hero p{font-size:12.8px}.back h3{font-size:21px}.definition{font-size:12px;line-height:1.3;margin-top:8px}.facts{gap:5px;margin-top:8px}.fact{font-size:11.3px;line-height:1.25;grid-template-columns:24px 1fr;gap:7px}.factNo{width:24px;height:24px}.takeaway{margin-top:8px;padding:8px 9px;font-size:11.3px;line-height:1.28}.backHint{padding-top:7px;font-size:9.5px}.nav{min-height:48px}.footer{padding-top:4px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.front{padding:19px}.back{padding:17px 18px}.hero h2{font-size:29px}.hero p{font-size:13px}.back h3{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="brand"><span class="mark">↗</span>LEAN FACTS</div><button class="overview" id="overview">☷ Översikt</button></div><div class="eyebrow">24 välkända Lean-fakta</div><h1>Lean på kort.</h1><p class="sub">Tryck på kortet för en kort förklaring. Ingen scroll behövs på korten.</p><div class="progressRow"><div class="progress"><i id="progress"></i></div><div class="count" id="count"></div></div></header>
<main class="stage" id="stage"></main>
<nav class="controls"><button class="nav" id="prev">← Föregående</button><button class="nav next" id="next">Nästa →</button></nav>
<div class="footer">Tryck på kortet för att vända · ingen swipe</div>
</div>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheetTop"><h2>Alla kort</h2><button class="close" id="close">×</button></div><div class="grid" id="grid"></div></section></div>
<script>
const C=[
["Historia","Toyota Production System","Lean har sina rötter i Toyotas produktionssystem.","TPS byggdes för hög kvalitet, korta ledtider och små lager.",["Två huvudpelare: Just-in-Time och Jidoka.","Taiichi Ohno är starkt förknippad med utvecklingen.","Lean är ett ledningssystem – inte bara verktyg."],"Förstå problemet bakom verktyget innan du kopierar det."],
["Historia","Lean Production – 1990","Begreppet blev globalt känt genom en MIT-studie.","The Machine That Changed the World publicerades 1990.",["Womack, Jones och Roos skrev boken.","Lean beskrev mer värde med färre resurser.","Studien jämförde bilindustrins produktionssystem."],"Lean betyder inte färre människor. Det betyder mindre slöseri."],
["Princip","Kundvärde först","Lean börjar med vad kunden faktiskt värderar.","Värde definieras ur kundens perspektiv – inte av intern vana.",["Värde ska kopplas till en specifik produkt eller tjänst.","Icke-värdeskapande steg ska synliggöras.","Nödvändigt stödarbete skiljs från rent slöseri."],"Fråga: Skulle kunden vilja betala för detta steg?"],
["Princip","De fem Lean-principerna","Värde → värdeflöde → flöde → pull → perfektion.","De fem principerna ger en enkel riktning för Lean-arbetet.",["Definiera värdet.","Se hela värdeflödet och skapa flöde.","Låt behov dra produktionen och förbättra ständigt."],"Princip först. Verktyg sedan."],
["Förlust","Muda = slöseri","Muda är arbete som förbrukar resurser utan kundvärde.","Lean försöker ta bort slöseri ur både material- och informationsflöden.",["Väntan och transporter är vanliga exempel.","Omarbete är också slöseri.","Synligt slöseri kan vara ett symptom på ett djupare problem."],"Hitta orsaken – inte någon att skylla på."],
["Förlust","Mura och Muri","Ojämnhet och överbelastning skapar ofta Muda.","Mura betyder ojämnhet. Muri betyder överbelastning.",["Mura skapar toppar, dalar och köer.","Muri ökar risk för fel, stopp och belastning.","De tre M:en bör ses tillsammans."],"Jämna ut flödet innan du jagar sekunder."],
["Förlust","De 8 slöserierna","En vanlig checklista för att se förluster.","Transport, lager, rörelse, väntan, överproduktion, överprocessning, fel och outnyttjad kompetens.",["Checklistan stödjer observation på Gemba.","Överproduktion driver ofta flera andra slöserier.","Outnyttjad kompetens läggs ofta till som nummer åtta."],"Använd listan för att se – inte för att fylla i en mall."],
["Flöde","Överproduktion är extra farligt","Att göra mer eller tidigare än behovet skapar problem.","Överproduktion bygger lager och gör avvikelser svårare att upptäcka.",["Mer WIP ger ofta längre ledtid.","Extra lager kräver yta och hantering.","Fel kan hinna produceras i större mängd."],"Producera efter behov, inte efter lokal maskinutnyttjandegrad."],
["Flöde","Takt time","Takttid kopplar kundbehov till produktionstakten.","Takttid = tillgänglig produktionstid ÷ kundbehov.",["Takt är inte samma sak som cykeltid.","Takt visar vilken genomsnittlig takt kunden kräver.","Den används för att balansera arbete och kapacitet."],"Takten kommer från kunden – inte från maskinen."],
["Flöde","One-piece flow","Ett stycke går vidare direkt i stället för att vänta i batch.","Kontinuerligt flöde minskar väntan, WIP och återkopplingstid.",["Fel upptäcks snabbare.","Ledtiden blir ofta kortare.","Små batcher är ett steg mot bättre flöde."],"Flytta problemet närmare ögonblicket det uppstår."],
["Pull","Pull-system","Nästa process signalerar vad den behöver.","Pull begränsar att material produceras utan verkligt behov.",["Efterfrågan drar flödet bakåt.","WIP kan begränsas tydligt.","Pull kräver stabila regler och disciplin."],"Fyll på det som förbrukats – inte det som råkar vara lätt att göra."],
["Pull","Kanban","Kanban är en signal för produktion eller påfyllnad.","Kort, låda, plats eller digital signal kan användas som Kanban.",["Kanban visualiserar tillåtna mängder.","Det hjälper till att begränsa WIP.","Kanban fungerar bäst i stabila repetitiva flöden."],"Kanban är en regel i ett pull-system – inte bara en tavla."],
["Kvalitet","Jidoka","Stoppa när ett fel eller onormalt läge upptäcks.","Jidoka bygger in kvalitet i processen i stället för att sortera efteråt.",["Problem ska synliggöras direkt.","Processen stoppas när det behövs.","Orsaken löses innan felet fortsätter."],"Bygg kvalitet vid källan."],
["Kvalitet","Andon","Andon gör ett problem synligt direkt.","En signal visar att processen behöver hjälp eller har stoppats.",["Kan vara ljus, skärm, ljud eller digital signal.","Syftet är snabb respons.","Andon ska leda till handling – inte bara visa rött."],"Visualisering utan respons är bara dekoration."],
["Kvalitet","Poka-Yoke","Felsäkra så att misstag blir svåra eller omöjliga.","Poka-Yoke förebygger fel eller gör dem omedelbart synliga.",["Bra lösningar är enkla och robusta.","De kan styra rätt montering eller rätt antal.","Förebyggande är bättre än kontroll i efterhand."],"Designa bort felet när det går."],
["Förbättring","Kaizen","Små kontinuerliga förbättringar varje dag.","Kaizen bygger på att de som gör arbetet också förbättrar det.",["Problem ses som möjligheter att lära.","Små steg minskar risk och ökar lärande.","Standardiserat arbete ger en bas att förbättra från."],"Gör förbättring till en del av jobbet."],
["Förbättring","PDCA","Plan → Do → Check → Act.","PDCA är en lärloop för att testa förändringar systematiskt.",["Planera hypotes och förväntat resultat.","Testa i liten skala.","Jämför resultat och justera nästa steg."],"Behandla förbättring som experiment."],
["Problemlösning","5 Why","Fråga varför flera gånger för att nå djupare orsak.","5 Why hjälper teamet att komma förbi det första symptomet.",["Antalet fem är inte en regel.","Varje svar ska stödjas av fakta.","Komplexa problem kan kräva fler analysverktyg."],"Sluta inte vid 'operatören gjorde fel'."],
["Problemlösning","A3","A3 strukturerar problemet på en sida.","A3 används för att tydliggöra nuläge, analys, mål och åtgärder.",["Formatet tvingar fram fokus.","Problemlösningen är viktigare än själva pappret.","A3 stödjer dialog och coaching."],"En bra A3 visar hur du tänkte – inte bara vad du gjorde."],
["Gemba","Go and see","Gemba betyder platsen där värdet skapas.","Lean-ledarskap bygger på att förstå verkligheten där arbetet sker.",["Se processen själv.","Prata med människorna som gör arbetet.","Utgå från fakta i stället för antaganden."],"Gå och se innan du bestämmer lösningen."],
["Standard","Standardized Work","Bästa kända arbetssättet just nu.","Standarden skapar en stabil bas för kvalitet, träning och förbättring.",["Standard är inte slutmålet.","Avvikelser blir lättare att se.","När ett bättre sätt hittas ska standarden uppdateras."],"Ingen standard = svårt att veta om processen förbättras."],
["Ställ","SMED","Minska ställtid för att möjliggöra mindre batcher.","SMED skiljer på arbete som kräver stopp och arbete som kan göras medan processen kör.",["Flytta interna moment till externa när det går.","Förenkla infästning och justering.","Kortare ställtid gör små batcher mer realistiska."],"Kort ställtid köper flexibilitet."],
["Arbetsplats","5S","Sortera, systematisera, städa, standardisera, skapa vana.","5S gör arbetsplatsen tydlig så att avvikelser blir lättare att se.",["Ta bort det som inte behövs.","Bestäm plats för det som behövs.","Bygg standard och vana kring ordningen."],"5S är visuell styrning – inte en städkampanj."],
["Utjämning","Heijunka","Jämna ut mix och volym över tid.","Heijunka minskar toppar och dalar som skapar stress, lager och väntan.",["Jämnare plan ger stabilare resursbehov.","Små batcher underlättar utjämning.","Heijunka kräver rimlig processstabilitet."],"Stabilitet slår ryckig lokal maxproduktion." ]
];
let i=0,flipped=false;
const stage=document.getElementById('stage'),count=document.getElementById('count'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),overlay=document.getElementById('overlay'),grid=document.getElementById('grid');
function render(){const x=C[i];flipped=false;const compact=(x[3].length+x[4].join('').length+x[5].length)>270?' compact':'';stage.innerHTML=`<article class="card${compact}" id="card" tabindex="0" aria-label="Vänd kort"><section class="face front"><div class="meta"><span class="tag">${x[0]}</span><span class="num">${i+1}/${C.length}</span></div><div class="hero"><h2>${x[1]}</h2><p>${x[2]}</p></div><div class="hint"><span><b>Tryck</b> för förklaring</span><span class="tap">↻</span></div></section><section class="face back"><div class="backTop"><div><span class="tag">${x[0]}</span><h3>${x[1]}</h3></div></div><p class="definition">${x[3]}</p><div class="facts">${x[4].map((p,n)=>`<div class="fact"><span class="factNo">${n+1}</span><span>${p}</span></div>`).join('')}</div><div class="takeaway"><b>Ta med dig</b>${x[5]}</div><div class="backHint">Tryck på kortet för att vända tillbaka</div></section></article>`;const card=document.getElementById('card');card.onclick=()=>{flipped=!flipped;card.classList.toggle('flipped',flipped)};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}};count.textContent=`${i+1}/${C.length}`;progress.style.width=`${(i+1)/C.length*100}%`;prev.disabled=i===0;next.disabled=i===C.length-1}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<C.length-1){i++;render()}};
document.getElementById('overview').onclick=()=>overlay.classList.add('open');document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};
grid.innerHTML=C.map((x,n)=>`<button class="mini" data-i="${n}"><small>${x[0]}</small><b>${x[1]}</b><span>Kort ${n+1}</span></button>`).join('');grid.onclick=e=>{const b=e.target.closest('.mini');if(!b)return;i=+b.dataset.i;overlay.classList.remove('open');render()};
render();
</script>
</body>
</html>
