<!doctype html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f1">
<title>Leanverktyg – Flashcards</title>
<style>
:root{
 --bg:#f2f4f1;--panel:#ffffff;--ink:#111a20;--muted:#68736d;--line:#dde4df;
 --green:#287653;--accent:#c9e43b;--front:#111a20;--frontText:#ffffff;--soft:#edf5ef;
 --shadow:0 18px 50px rgba(16,24,32,.15);--overlay:rgba(8,13,17,.58)
}
html[data-theme="dark"]{
 --bg:#0d1418;--panel:#172127;--ink:#f3f7f4;--muted:#a7b2ac;--line:#2a373d;
 --green:#66c995;--accent:#c9e43b;--front:#1a252b;--frontText:#ffffff;--soft:#20322b;
 --shadow:0 18px 55px rgba(0,0,0,.42);--overlay:rgba(0,0,0,.72)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{transition:background .2s,color .2s}button{font:inherit}.app{width:min(560px,100%);height:100svh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:9px;overflow:hidden}
header{padding:0 2px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.04em;font-size:13px}.logo{width:32px;height:32px;border-radius:10px;background:var(--front);color:var(--accent);display:grid;place-items:center;font-size:18px}.topBtns{display:flex;gap:7px}.pill{border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:9px 11px;font-size:12px;font-weight:900;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.05)}h1{margin:12px 0 3px;font-size:31px;line-height:1;letter-spacing:-.045em}.lead{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35}.progressRow{display:flex;align-items:center;gap:10px;margin-top:10px}.progress{height:6px;flex:1;border-radius:99px;background:var(--line);overflow:hidden}.progress>i{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .2s}.counter{min-width:46px;text-align:right;color:var(--muted);font-size:11px;font-weight:900}
.stage{min-height:0;perspective:1400px}.card{position:relative;width:100%;height:100%;min-height:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.face{position:absolute;inset:0;border-radius:25px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.22,1),opacity .15s linear;will-change:transform}
.front{z-index:2;transform:rotateY(0deg);background:var(--front);color:var(--frontText);padding:23px;display:flex;flex-direction:column}.back{z-index:1;transform:rotateY(180deg);background:var(--panel);color:var(--ink);padding:21px;display:flex;flex-direction:column}.card.flipped .front{transform:rotateY(-180deg);z-index:1}.card.flipped .back{transform:rotateY(0deg);z-index:2}.front:after{content:"";position:absolute;width:270px;height:270px;border:46px solid rgba(201,228,59,.12);border-radius:50%;right:-125px;top:-130px}.frontTop,.frontMain,.frontFoot{position:relative;z-index:1}.frontTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.category{display:inline-flex;width:max-content;border-radius:999px;background:var(--accent);color:#16200f;padding:6px 9px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.07em}.number{font-size:11px;color:#c7d0cc;font-weight:900}.frontMain{margin:auto 0}.frontMain h2{font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:-.05em;margin:0}.frontMain p{font-size:14px;line-height:1.45;color:#d7dfdb;margin:14px 0 0;max-width:92%}.frontFoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.16);padding-top:13px;color:#cbd5d0;font-size:11px}.flipIcon{width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px}
.backTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.backTop h3{margin:8px 0 0;font-size:clamp(22px,6vw,29px);line-height:1.04;letter-spacing:-.04em}.badge{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:950}.description{font-size:13.4px;line-height:1.4;color:var(--ink);margin:12px 0 0}.how{margin-top:13px;padding:12px 13px;border-radius:15px;background:var(--soft);border:1px solid var(--line)}.how b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--green);margin-bottom:5px}.how p{margin:0;font-size:12.4px;line-height:1.4;color:var(--ink)}.points{display:grid;gap:7px;margin-top:12px}.point{display:grid;grid-template-columns:25px 1fr;align-items:start;gap:8px;font-size:12.1px;line-height:1.32;color:var(--ink)}.dot{width:25px;height:25px;border-radius:8px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:950;font-size:11px}.source{margin-top:auto;border-top:1px solid var(--line);padding-top:9px;font-size:10px;line-height:1.3}.source a{color:var(--green);text-decoration:none;font-weight:850}.source span{color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{min-height:52px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);font-weight:950;font-size:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}.nav.next{background:var(--green);color:#fff;border-color:transparent}.nav:disabled{opacity:.35}.footer{text-align:center;color:var(--muted);font-size:9.5px}
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);padding:16px;display:none}.overlay.open{display:flex}.sheet{margin:auto;width:min(620px,100%);max-height:88svh;overflow:auto;background:var(--bg);border-radius:25px;padding:18px}.sheetTop{position:sticky;top:-18px;z-index:2;background:var(--bg);padding:1px 0 12px;display:flex;align-items:center;justify-content:space-between}.sheetTop h2{margin:0;font-size:24px}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink);font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px;text-align:left;min-height:92px;box-shadow:0 3px 12px rgba(0,0,0,.04)}.mini small{display:block;color:var(--green);font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.mini strong{display:block;margin-top:6px;font-size:13px;line-height:1.2}.mini span{display:block;margin-top:5px;color:var(--muted);font-size:10px}
@media(max-height:720px){.app{padding-top:8px;gap:7px}h1{font-size:26px;margin-top:8px}.lead{display:none}.progressRow{margin-top:7px}.front{padding:19px}.frontMain h2{font-size:31px}.frontMain p{font-size:12.5px}.back{padding:17px 18px}.backTop h3{font-size:21px}.description{font-size:11.8px;line-height:1.28;margin-top:7px}.how{margin-top:7px;padding:8px 9px}.how p{font-size:10.8px;line-height:1.25}.points{margin-top:7px;gap:4px}.point{font-size:10.4px;line-height:1.2;grid-template-columns:21px 1fr}.dot{width:21px;height:21px}.source{padding-top:5px;font-size:8.8px}.nav{min-height:47px}.footer{font-size:9px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.front{padding:19px}.back{padding:17px 18px}.frontMain h2{font-size:31px}.description{font-size:12px}.pill{padding:8px 9px;font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><div class="brand"><span class="logo">↗</span> LEAN TOOLBOX</div><div class="topBtns"><button class="pill" id="themeBtn" aria-label="Växla tema">☾ Mörk</button><button class="pill" id="overviewBtn">☷ Översikt</button></div></div>
<h1>Leanverktyg på kort.</h1><p class="lead">Tryck på kortet för att vända det. Källa finns längst ner på varje baksida.</p>
<div class="progressRow"><div class="progress"><i id="progress"></i></div><div class="counter" id="counter"></div></div>
</header>
<main class="stage"><article class="card" id="card" tabindex="0" role="button" aria-label="Vänd kort"><div class="face front" id="front"></div><div class="face back" id="back"></div></article></main>
<nav class="controls"><button class="nav" id="prev">← Föregående</button><button class="nav next" id="next">Nästa →</button></nav>
<div class="footer">Klicka/tappa på kortet för att vända · ingen swipe</div>
</div>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheetTop"><h2>Alla leanverktyg</h2><button class="close" id="close" aria-label="Stäng">×</button></div><div class="grid" id="grid"></div></section></div>
<script>
const LEI="https://www.lean.org/store/book/lean-lexicon-6th-edition/";
const cards=[
{n:"20 Cycle Check",c:"Mätning",f:"Mät flera cykler för att se verklig cykeltid och variation.",d:"En praktisk tidsobservation där samma arbetscykel mäts upprepade gånger. Syftet är att förstå variationen och skapa faktabaserat underlag för standardiserat arbete.",h:"Mät 20 cykler i följd. Notera avvikelser – inte bara medelvärdet.",p:["Synliggör variation mellan cykler.","Bra underlag för Standard Work.","Undersök orsaken bakom toppar och dalar."],s:"Lean Enterprise Institute – Standardized Work",u:"https://www.lean.org/lexicon-terms/standardized-work/"},
{n:"Fiskbensdiagram",c:"Problemlösning",f:"Strukturera möjliga orsaker till ett problem.",d:"Även kallat Ishikawa- eller cause-and-effect-diagram. Möjliga orsaker grupperas i grenar för att göra analysen tydligare.",h:"Skriv problemet i fiskens huvud och samla möjliga orsaker i huvudgrenar.",p:["Skapar struktur i analysen.","Bra när många faktorer kan påverka.","Verifiera möjliga orsaker med fakta."],s:"ASQ – Fishbone Diagram",u:"https://asq.org/quality-resources/fishbone"},
{n:"5 Varför",c:"Problemlösning",f:"Fråga varför flera gånger för att nå bakom symptomet.",d:"5 Varför hjälper teamet att gå från ett synligt problem mot en bakomliggande orsak. Fem är en tumregel – det kan behövas fler eller färre frågor.",h:"Utgå från ett konkret problem. Låt varje svar bli utgångspunkt för nästa varför.",p:["Fokusera på process – inte person.","Stöd svaren med fakta.","Stanna inte vid första rimliga förklaringen."],s:"ASQ – Five Whys",u:"https://asq.org/quality-resources/five-whys"},
{n:"5S",c:"Arbetsplats",f:"Skapa en tydlig, säker och stabil arbetsplats.",d:"5S är en metod för att organisera arbetsplatsen så att det normala läget blir tydligt och avvikelser lättare att upptäcka.",h:"Sortera, ordna, rengör, standardisera och skapa disciplin för att hålla nivån.",p:["Minskar letande och onödig rörelse.","Gör avvikelser synliga snabbare.","Kräver återkommande uppföljning."],s:"Lean Enterprise Institute – 5S",u:"https://www.lean.org/lexicon-terms/five-s/"},
{n:"Kaizen",c:"Förbättring",f:"Kontinuerliga förbättringar nära arbetet.",d:"Kaizen innebär förbättring genom många återkommande steg där de som arbetar i processen deltar aktivt i att göra arbetet bättre.",h:"Identifiera ett problem, testa en förbättring, följ upp och standardisera det som fungerar.",p:["Gör förbättring till vardagsarbete.","Engagerar människor nära processen.","Bygger lärande över tid."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"VSM",c:"Flöde",f:"Kartlägg hela värdeflödet – material och information.",d:"Value Stream Mapping visualiserar de steg och informationsflöden som krävs för att föra en produkt från behov till leverans.",h:"Rita nuläget först. Identifiera förluster. Skapa sedan ett framtida läge.",p:["Se helheten – inte bara en maskin.","Synliggör väntan och lager.","Koppla förbättringar till framtida flöde."],s:"Lean Enterprise Institute – Value Stream Mapping",u:"https://www.lean.org/lexicon-terms/value-stream-mapping/"},
{n:"Poka-Yoke",c:"Kvalitet",f:"Förebygg fel eller gör dem omedelbart synliga.",d:"Poka-Yoke är felsäkring. Lösningen ska helst hindra att felet uppstår eller upptäcka det direkt i processen.",h:"Utgå från ett återkommande fel och bygg bort möjligheten med en enkel fysisk eller digital lösning.",p:["Förebygga är bättre än inspektera.","Enkel teknik räcker ofta.","Snabb återkoppling minskar följdfel."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"SMED",c:"Ställtid",f:"Minska ställtiden och möjliggör mindre batcher.",d:"Single-Minute Exchange of Die är ett systematiskt sätt att reducera omställningstid, bland annat genom att skilja interna och externa ställmoment.",h:"Observera stället. Flytta arbete från stoppad maskin till före eller efter stoppet och förenkla momenten.",p:["Separera internt och externt arbete.","Eliminera letande och justering.","Standardisera den nya ställmetoden."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"OEE",c:"Utrustning",f:"Mät hur effektivt utrustningen används under planerad produktionstid.",d:"Overall Equipment Effectiveness kombinerar Tillgänglighet × Prestanda × Kvalitet för att synliggöra utrustningsrelaterade förluster.",h:"Bryt alltid ned OEE i de tre faktorerna. Totalsiffran ensam visar inte vad som ska förbättras.",p:["Tillgänglighet: stoppförluster.","Prestanda: hastighetsförluster.","Kvalitet: kassation och omarbete."],s:"Vorne – OEE",u:"https://www.oee.com/oee.htm"},
{n:"Standard Work",c:"Standard",f:"Definiera bästa kända sättet att utföra arbetet idag.",d:"Standardiserat arbete beskriver arbetets sekvens, takt och nödvändigt standardlager. Standarden är baslinjen för nästa förbättring.",h:"Observera verkligheten, definiera arbetssekvensen och gör standarden enkel och synlig.",p:["Minskar variation.","Underlättar träning.","Skapar baslinje för Kaizen."],s:"Lean Enterprise Institute – Standardized Work",u:"https://www.lean.org/lexicon-terms/standardized-work/"},
{n:"Kanban",c:"Pull",f:"Visuell signal som styr påfyllnad och produktion efter behov.",d:"Kanban används i pull-system för att signalera vad som ska produceras eller fyllas på och för att begränsa mängden material i flödet.",h:"Bestäm tydligt när signalen utlöses, hur mycket som fylls på och vem som ansvarar.",p:["Kopplar produktion till faktisk förbrukning.","Begränsar WIP.","Gör problem i flödet tydligare."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"Andon",c:"Visualisering",f:"Gör processens status och problem synliga direkt.",d:"Andon är visuell styrning som visar normalt eller avvikande läge och kan kalla på stöd när ett problem uppstår.",h:"Visa få tydliga statuslägen och definiera exakt vilken reaktion varje avvikelse ska ge.",p:["Snabbare respons på problem.","Stödjer Jidoka.","Status ska gå att förstå på avstånd."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"Jidoka",c:"Kvalitet",f:"Stoppa och reagera när ett onormalt tillstånd uppstår.",d:"Jidoka innebär att kvalitet byggs in i processen. När en avvikelse upptäcks ska processen kunna stoppa och problemet hanteras vid källan.",h:"Definiera vad som är normalt, upptäck avvikelsen snabbt och skapa en tydlig stopp- och eskaleringsrutin.",p:["Bygg kvalitet i processen.","Förhindra att fel skickas vidare.","Gör orsaken synlig nära händelsen."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"Heijunka",c:"Utjämning",f:"Jämna ut produktionsmix och volym över tiden.",d:"Heijunka minskar stora variationer i belastning genom att jämna ut vad som produceras och när det produceras.",h:"Analysera efterfrågemix och skapa mindre, återkommande sekvenser i stället för stora kampanjbatcher.",p:["Minskar ojämnhet – Mura.","Stödjer mindre lager.","Gör flödet mer förutsägbart."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"Takt Time",c:"Flöde",f:"Kundbehov omräknat till nödvändig produktionstakt.",d:"Takttid beräknas som tillgänglig produktionstid dividerat med kundens efterfrågan. Den används som en rytm för processdesign och balansering.",h:"Räkna på verklig tillgänglig tid och aktuellt kundbehov. Jämför sedan cykeltider med takt.",p:["Takt kommer från kunden.","Takt är inte samma sak som cykeltid.","Bra bas för balansering."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"Gemba Walk",c:"Ledarskap",f:"Gå till platsen där arbetet faktiskt sker.",d:"Gemba betyder den verkliga platsen. En Gemba Walk används för att förstå processen genom observation och dialog i stället för att enbart förlita sig på rapporter.",h:"Gå dit arbetet sker, observera utan att anta och ställ frågor om standard, problem och flöde.",p:["Se verkligheten själv.","Fråga innan du föreslår lösning.","Fokusera på processen."],s:"Lean Enterprise Institute – Leader Standard Work",u:"https://www.lean.org/lexicon-terms/leader-standard-work/"},
{n:"PDCA",c:"Förbättring",f:"Planera, testa, kontrollera och justera.",d:"PDCA är en iterativ metod för lärande och förbättring där idéer testas mot verkliga resultat innan de standardiseras eller justeras.",h:"Planera hypotes och mätetal. Genomför testet. Kontrollera resultatet. Agera på lärandet.",p:["Bygger förbättring på experiment.","Minskar gissningar.","Upprepa cykeln kontinuerligt."],s:"Lean Enterprise Institute – Value-Stream Improvement",u:"https://www.lean.org/lexicon-terms/value-stream-improvement/"},
{n:"A3",c:"Problemlösning",f:"Strukturera problemlösning och lärande på en A3-sida.",d:"A3-tänkande skapar en gemensam logik från bakgrund och nuläge till orsaksanalys, motåtgärder, uppföljning och lärande.",h:"Gör analysen visuellt tydlig och bygg resonemanget stegvis med fakta från processen.",p:["Berättar en sammanhängande problemlösningshistoria.","Tvingar fram tydlighet.","Stödjer coaching och samsyn."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI},
{n:"TPM",c:"Underhåll",f:"Bygg stabil utrustning genom strukturerat underhåll och operatörsdelaktighet.",d:"Total Productive Maintenance fokuserar på att maximera utrustningens effektivitet genom förebyggande arbete och bred delaktighet i att upptäcka och eliminera förluster.",h:"Synliggör utrustningsförluster, bygg grundläggande skötselrutiner och följ upp återkommande fel.",p:["Färre oplanerade stopp.","Bättre grundskick.","Stark koppling till OEE."],s:"JIPM – Total Productive Maintenance",u:"https://jipmglobal.com/"},
{n:"8 slöserier",c:"Förluster",f:"En checklista för att se aktiviteter som inte skapar kundvärde.",d:"Lean använder slöserikategorier för att träna ögat att se förluster i flödet, exempelvis väntan, transport, lager, rörelse, fel och överproduktion.",h:"Observera processen och märk konkreta exempel. Prioritera sedan de förluster som påverkar flödet mest.",p:["Överproduktion driver ofta andra slöserier.","Se även informationsflöden.","Använd listan för observation – inte som mål i sig."],s:"Lean Enterprise Institute – Lean Lexicon",u:LEI}
];
let i=0;
const card=document.getElementById('card'),front=document.getElementById('front'),back=document.getElementById('back'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),overlay=document.getElementById('overlay'),grid=document.getElementById('grid'),themeBtn=document.getElementById('themeBtn');
function render(){
 const x=cards[i]; card.classList.remove('flipped');
 front.innerHTML=`<div class="frontTop"><span class="category">${x.c}</span><span class="number">${String(i+1).padStart(2,'0')} / ${cards.length}</span></div><div class="frontMain"><h2>${x.n}</h2><p>${x.f}</p></div><div class="frontFoot"><span>Tryck för att se beskrivning</span><span class="flipIcon">↻</span></div>`;
 back.innerHTML=`<div class="backTop"><div><span class="category">${x.c}</span><h3>${x.n}</h3></div><span class="badge">✓</span></div><p class="description">${x.d}</p><div class="how"><b>Så använder du det</b><p>${x.h}</p></div><div class="points">${x.p.map((p,j)=>`<div class="point"><span class="dot">${j+1}</span><span>${p}</span></div>`).join('')}</div><div class="source"><span>Källa: </span><a href="${x.u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${x.s} ↗</a></div>`;
 counter.textContent=`${i+1} / ${cards.length}`;progress.style.width=`${(i+1)/cards.length*100}%`;prev.disabled=i===0;next.disabled=i===cards.length-1;
}
function flip(){card.classList.toggle('flipped')}
card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<cards.length-1){i++;render()}};
document.getElementById('overviewBtn').onclick=()=>overlay.classList.add('open');document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};
grid.innerHTML=cards.map((x,j)=>`<button class="mini" data-i="${j}"><small>${x.c}</small><strong>${x.n}</strong><span>${x.f}</span></button>`).join('');grid.onclick=e=>{const b=e.target.closest('.mini');if(!b)return;i=+b.dataset.i;overlay.classList.remove('open');render()};
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('leanTheme',t);themeBtn.textContent=t==='dark'?'☀ Ljus':'☾ Mörk';document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#0d1418':'#f2f4f1')}
setTheme(localStorage.getItem('leanTheme')||'light');themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();
</script>
</body>
</html>
